# Cartouche canary (feature/retone-2027 only — do NOT merge this file to develop
# before the ebpro/cartouche extension is on a tagged utils-ref).
#
# `extensions:` is listed here with BOTH entries because a directory-level
# `_metadata.yml` key overrides the shared `_quarto.yml` key (REPLACE semantics,
# Quarto precedence: front matter > _metadata.yml > profile > project _quarto.yml):
# repeating `_extensions/grantmcdermott/clean` keeps the shared styling active.
# The extension itself lives in _quarto-utils (PR #43) and resolves through the
# repo's `_extensions` -> `_quarto-utils/_extensions` symlink at the pinned
# `utils-ref` in .github/workflows/ci-render.yml.
extensions:
  - _extensions/grantmcdermott/clean
  - _extensions/ebpro/cartouche

# Values consumed by cartouche.lua (colophon + JSON-LD + revealjs footer/end-slide
# + typst colophon). Static for the plumbing canary: regenerate with
# scripts/cartouche-info.sh (CI-side generation is the endgame mechanism).
