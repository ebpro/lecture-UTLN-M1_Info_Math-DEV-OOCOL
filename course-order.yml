# Section titles live in index.qmd headings (Quarto 1.10 listing schema has no title property)
# OOCOL — M1 Info & Math: DEV OO Collaboratif
# v2026 arc: explicit ordered file lists (no globs, no sort — list order IS the pedagogical order)
# 13 sections; sec-NN ids stay tied to their ELO directory; arc ordering is realized by section
# order in index.qmd and entry order within each section's contents list.
# Card keys mirrored from _quarto-utils/index-listing.yml (except `sort`, deliberately: the
# explicit contents order above IS the pedagogical order and must not be re-sorted).
# Root-index listings reference LESSON files only: the module index.qmd pages are deduplicated
# out of the root listing (they remain reachable via the sidebar / their own gallery pages).
listing:
  # 1) Origins + first contact with Java
  - id: sec-01
    contents:
      - 01-notebook-java-introduction/00_java_L_origines.qmd
      - 01-notebook-java-introduction/01_java_101_L_Introduction.qmd
    type: grid
    sort: false
    grid-columns: 3
    grid-item-border: true
    image-height: 250px
    fields:
      - "title"
      - "subtitle"
      - "description"
      - "date"
      - "categories"
    categories: true
    date-format: "DD MMMM YYYY"
    template: ./_quarto-utils/gallery.ejs
    max-description-length: 200
