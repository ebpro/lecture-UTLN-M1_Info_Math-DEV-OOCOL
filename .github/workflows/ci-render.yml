name: Render Quarto (calls shared workflow)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  call-shared-render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.3.6
    secrets: inherit
    with:
      profiles: 'notes,slides'
      quarto-image: 'harbor.ebruno.fr/ghcr-p2c/ebpro/jupyter-base:quarto-full-fix-chromium-ci-headless-render'
      utils-repo: 'ebpro/_quarto-utils'
      utils-ref: 'v1.3.6'
      enable-docker: true
      output-path: '_output'
      deploy-pages: true
      deploy-cloudflare: true
      cf-project-name: 'lecture-utln-m1-info-math-dev-oocol'
