name: CI Render
on:
  push:
    branches: ['**']
    tags: ['v*']
  # v1.3.22: preview deploys + auto-cleanup
  delete:
    branches: ['**']
  pull_request:
    branches: [develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.3.39
    secrets: inherit
    with:
      utils-ref: v1.3.39
      seo-directives: false
      site-transport: staging
      hang-detection-minutes: 20
      deploy-static: ${{ github.event_name != 'pull_request' }}
      quarto-image: "ghcr.io/ebpro/solen:quarto-full-68c5fb9"
      profiles: "notes,slides"
      enable-docker: true