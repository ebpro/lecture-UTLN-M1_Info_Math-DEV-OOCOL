name: CI Render
on:
  push:
    branches: [develop, feature/upgrade-2026]
    tags: ['v*']
  # v1.3.22: preview deploys + auto-cleanup
  delete:
    branches: ['**']
  pull_request:
    branches: [develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.3.24
    secrets: inherit
    with:
      utils-ref: v1.3.29
      deploy-static: ${{ github.event_name != 'pull_request' }}
      quarto-image: "ghcr.io/ebpro/solen:quarto-full-build-20261010T172146Z"
      profiles: "notes,slides"
      deploy-pages: true
      deploy-cloudflare: true
      cf-project-name: "lecture-utln-m1-info-math-dev-oocol"
      enable-docker: true
