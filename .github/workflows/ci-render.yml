name: CI Render
on:
  push:
    branches: [develop, feature/upgrade-2026, feature/retone-2027]
    tags: ['v*']
  # v1.3.22: preview deploys + auto-cleanup
  delete:
    branches: ['**']
  pull_request:
    branches: [develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.3.36
    secrets: inherit
    with:
      # Canary-only SHA pin: _quarto-utils develop f880276 (= v1.3.36 + v1.3.37/38
      # content + ebpro/cartouche extension, PR #43). Revert to a fleet tag once the
      # extension ships in one. Do NOT merge this line to develop while untagged.
      utils-ref: f880276b623d4d0b0af04c50695bcde6b827785a
      site-transport: staging
      hang-detection-minutes: 20
      deploy-static: ${{ github.event_name != 'pull_request' }}
      quarto-image: "ghcr.io/ebpro/solen:quarto-full-build-20261010T172146Z"
      profiles: "notes,slides"
      enable-docker: true
