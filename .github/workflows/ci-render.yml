name: CI Render
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.3.7
    secrets: inherit
    with:
      utils-ref: develop
      quarto-image: "ghcr.io/ebpro/jupyter-base:quarto-full-fix-chromium-ci-headless-render"
      profiles: "notes,slides"
      deploy-pages: true
      deploy-cloudflare: true
      cf-project-name: "lecture-utln-m1-info-math-dev-oocol"
      enable-docker: true
